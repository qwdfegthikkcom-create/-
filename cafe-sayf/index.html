<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كافي صيف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded as non-blocking preload so the app stays instantly usable offline; the decorative font
     simply swaps in later if/when this succeeds, instead of stalling the whole page on a stylesheet. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;900&display=swap"></noscript>
<style>
:root{
  --sand-light:#f6ecd9;
  --sand:#eddab3;
  --sand-dark:#d8b378;
  --terracotta:#c1682f;
  --terracotta-dark:#9c4f22;
  --night:#3a2416;
  --night-light:#5a3a24;
  --gold:#d4a853;
  --cream:#fffaf2;
  --green:#4f7a4a;
  --red:#a5311f;
  --shadow:0 8px 24px rgba(58,36,22,.18);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Tajawal',Tahoma,sans-serif;
  background:linear-gradient(180deg,var(--sand-light),var(--sand) 40%,var(--sand-light));
  color:var(--night);
  min-height:100vh;
  overflow-x:hidden;
}
.logo-font{font-family:'Lalezar',Tahoma,sans-serif;letter-spacing:1px;}

/* ===== Desert texture background accents ===== */
.dune-bg{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 30% at 20% 100%, rgba(193,104,47,.18), transparent),
    radial-gradient(ellipse 50% 25% at 85% 95%, rgba(212,168,83,.25), transparent);
}

/* ===== Header / Hero ===== */
header.hero{
  position:relative;
  min-height:46vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  color:var(--cream);
  overflow:hidden;
  border-bottom:6px solid var(--gold);
}
header.hero .hero-img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:brightness(.55) saturate(1.1);
  animation:zoomSlow 18s ease-in-out infinite alternate;
}
@keyframes zoomSlow{from{transform:scale(1)}to{transform:scale(1.08)}}
header.hero svg.hero-scene{position:absolute;inset:0;width:100%;height:100%;}
header.hero svg.hero-scene .sun{animation:sunGlow 4s ease-in-out infinite alternate;transform-origin:center;opacity:.55;}
@keyframes sunGlow{from{opacity:.5}to{opacity:.6}}
header.hero svg.hero-scene .star{animation:twinkle 2.4s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
header.hero svg.hero-scene .lantern{animation:sway 3.5s ease-in-out infinite;transform-origin:top center;}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
header.hero .text-scrim{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 75% 85% at 50% 58%, rgba(15,8,4,.78), transparent 78%);
}
header.hero .hero-content{position:relative;z-index:2;padding:20px;animation:heroIn 1s ease both;}
@keyframes heroIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
header.hero h1{
  font-family:'Lalezar',Tahoma,sans-serif;
  font-size:clamp(3rem,10vw,5.5rem);
  color:var(--gold);
  text-shadow:0 4px 18px rgba(0,0,0,.55);
  line-height:1;
}
header.hero p.tag{
  margin-top:10px;font-size:1.15rem;color:var(--sand-light);
  text-shadow:0 2px 8px rgba(0,0,0,.5);
}
header.hero .divider{
  width:120px;height:3px;margin:16px auto;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

/* ===== Cashier corner button ===== */
.cashier-btn{
  position:fixed;top:16px;left:16px;z-index:56;
  background:var(--night);color:var(--gold);
  border:2px solid var(--gold);
  border-radius:16px;
  padding:10px 16px;
  display:flex;align-items:center;gap:8px;
  font-weight:700;font-size:.95rem;
  cursor:pointer;box-shadow:var(--shadow);
  transition:transform .2s ease, background .2s ease;
}
.cashier-btn:hover{transform:translateY(-2px) scale(1.03);background:var(--night-light);}
.cashier-btn .dot{
  width:9px;height:9px;border-radius:50%;background:#3ddc6a;
  box-shadow:0 0 0 rgba(61,220,106,.6);
  animation:pulseDot 1.6s infinite;
}
@keyframes pulseDot{
  0%{box-shadow:0 0 0 0 rgba(61,220,106,.6)}
  70%{box-shadow:0 0 0 8px rgba(61,220,106,0)}
  100%{box-shadow:0 0 0 0 rgba(61,220,106,0)}
}

/* ===== Category tabs ===== */
.tabs-wrap{
  position:sticky;top:0;z-index:30;
  background:rgba(246,236,217,.92);backdrop-filter:blur(6px);
  padding:14px 0 10px;
  border-bottom:2px solid var(--sand-dark);
}
.tabs{
  display:flex;gap:10px;overflow-x:auto;padding:0 16px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto;
  padding:9px 20px;border-radius:999px;
  background:var(--cream);border:2px solid var(--sand-dark);
  color:var(--night-light);font-weight:700;cursor:pointer;
  white-space:nowrap;transition:all .25s ease;
  display:flex;align-items:center;gap:6px;
}
.tab.active{
  background:var(--terracotta);border-color:var(--terracotta-dark);
  color:#fff;transform:translateY(-2px);
  box-shadow:0 6px 14px rgba(193,104,47,.4);
}

/* ===== Menu grid ===== */
main{max-width:1100px;margin:0 auto;padding:22px 16px 120px;}
.section-title{
  font-family:'Lalezar',Tahoma,sans-serif;
  font-size:1.9rem;color:var(--terracotta-dark);
  margin:6px 4px 16px;
}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:18px;
}
.card{
  background:var(--cream);border-radius:18px;overflow:hidden;
  box-shadow:var(--shadow);
  border:1px solid var(--sand-dark);
  opacity:0;transform:translateY(16px);
  animation:cardIn .5s ease forwards;
}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.card .img-wrap{position:relative;height:150px;overflow:hidden;background:linear-gradient(135deg,var(--sand),var(--sand-dark));}
.card .img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease;}
.card:hover .img-wrap img{transform:scale(1.08);}
.card .img-wrap .emoji-fallback{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3.2rem;
}
.card .body{padding:12px 14px 14px;}
.card h3{font-size:1.05rem;color:var(--night);}
.card p.desc{font-size:.8rem;color:var(--night-light);opacity:.85;margin:4px 0 8px;min-height:32px;}
.card .row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.price{color:var(--red);font-weight:900;font-size:1.05rem;}
.qty-box{display:flex;align-items:center;gap:8px;background:var(--sand-light);border-radius:10px;padding:4px 8px;}
.qty-box button{
  width:24px;height:24px;border:none;border-radius:6px;background:var(--terracotta);color:#fff;
  font-size:1rem;cursor:pointer;line-height:1;
}
.qty-box span{min-width:16px;text-align:center;font-weight:700;}
.add-btn{
  margin-top:10px;width:100%;padding:9px;border:none;border-radius:10px;
  background:var(--night);color:var(--gold);font-weight:800;cursor:pointer;
  transition:transform .15s ease,background .2s ease;
}
.add-btn:active{transform:scale(.95);}
.add-btn.flash{animation:flash .5s ease;}
@keyframes flash{0%{background:#3ddc6a;color:#123}100%{background:var(--night);color:var(--gold)}}

/* ===== Floating cart ===== */
.cart-fab{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--terracotta);color:#fff;border:none;border-radius:999px;
  padding:14px 26px;display:flex;align-items:center;gap:10px;
  font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 10px 26px rgba(193,104,47,.5);
  z-index:40;transition:transform .2s ease;
}
.cart-fab.bump{animation:bump .35s ease;}
@keyframes bump{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.12)}100%{transform:translateX(-50%) scale(1)}}
.cart-fab .badge{
  background:var(--gold);color:var(--night);border-radius:999px;
  padding:2px 9px;font-size:.85rem;
}

/* ===== Slide panels (cart / cashier) ===== */
.overlay{
  position:fixed;inset:0;background:rgba(58,36,22,.55);opacity:0;pointer-events:none;
  transition:opacity .3s ease;z-index:60;
}
.overlay.show{opacity:1;pointer-events:auto;}
.panel{
  position:fixed;top:0;bottom:0;width:min(400px,92vw);
  background:var(--cream);box-shadow:-8px 0 30px rgba(0,0,0,.25);
  z-index:70;display:flex;flex-direction:column;
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
}
.panel.right{left:0;transform:translateX(-100%);}
.panel.right.show{transform:translateX(0);}
.panel.left{right:0;transform:translateX(100%);}
.panel.left.show{transform:translateX(0);}
.panel-head{
  background:var(--night);color:var(--gold);padding:16px 18px;
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Lalezar';font-size:1.3rem;
}
.panel-head button{background:none;border:none;color:var(--gold);font-size:1.3rem;cursor:pointer;}
.panel-body{flex:1;overflow-y:auto;padding:14px 16px;}
.panel-foot{padding:14px 16px;border-top:2px solid var(--sand-dark);}

.cart-item{display:flex;gap:10px;background:var(--sand-light);border-radius:12px;padding:10px;margin-bottom:10px;align-items:center;}
.cart-item img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:0 0 auto;}
.cart-item .emoji-fallback{width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:var(--sand-dark);flex:0 0 auto;}
.cart-item .info{flex:1;}
.cart-item .info h4{font-size:.92rem;}
.cart-item .info small{color:var(--night-light);}
.cart-item .del{background:none;border:none;color:var(--red);font-size:1.1rem;cursor:pointer;}
.total-row{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;margin-bottom:10px;}
.field{width:100%;padding:9px 10px;border-radius:10px;border:2px solid var(--sand-dark);margin-bottom:10px;font-family:inherit;background:#fff;}
.btn-main{
  width:100%;padding:12px;border:none;border-radius:12px;background:var(--terracotta);
  color:#fff;font-weight:800;font-size:1rem;cursor:pointer;
}
.btn-main:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost{
  width:100%;padding:10px;border:2px solid var(--night);border-radius:12px;background:none;
  color:var(--night);font-weight:700;margin-top:8px;cursor:pointer;
}

/* ===== Cashier panel ===== */
.cashier-tabs{display:flex;gap:8px;margin-bottom:12px;}
.cashier-tabs button{
  flex:1;padding:8px;border-radius:10px;border:2px solid var(--sand-dark);background:var(--sand-light);
  font-weight:700;cursor:pointer;color:var(--night-light);
}
.cashier-tabs button.active{background:var(--night);color:var(--gold);border-color:var(--night);}
.order-card{
  background:var(--sand-light);border-radius:12px;padding:10px 12px;margin-bottom:10px;
  border-inline-start:5px solid var(--terracotta);
}
.order-card.status-ready{border-inline-start-color:var(--green);}
.order-card.status-done{border-inline-start-color:#999;opacity:.75;}
.order-card .top{display:flex;justify-content:space-between;font-weight:800;margin-bottom:4px;}
.order-card .line{display:flex;justify-content:space-between;font-size:.85rem;margin:2px 0;color:var(--night-light);}
.order-card .actions{display:flex;gap:6px;margin-top:8px;}
.order-card .actions button{
  flex:1;padding:6px;border-radius:8px;border:none;font-size:.8rem;font-weight:700;cursor:pointer;
}
.btn-accept{background:var(--green);color:#fff;}
.btn-pay{background:var(--gold);color:var(--night);}
.btn-print{background:var(--night);color:var(--gold);}
.empty-msg{text-align:center;color:var(--night-light);opacity:.7;padding:30px 10px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat{background:var(--sand-light);border-radius:12px;padding:12px;text-align:center;}
.stat b{display:block;font-size:1.3rem;color:var(--terracotta-dark);}
.stat span{font-size:.78rem;color:var(--night-light);}

/* ===== Toast ===== */
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--night);color:var(--gold);padding:10px 22px;border-radius:999px;
  opacity:0;transition:all .35s ease;z-index:90;font-weight:700;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== Print invoice ===== */
#invoice{display:none;}
@media print{
  body *{visibility:hidden;}
  #invoice, #invoice *{visibility:visible;}
  #invoice{
    display:block;position:fixed;top:0;left:0;width:100%;padding:20px;
    font-family:'Tajawal',sans-serif;color:#000;
  }
  #invoice h2{font-family:'Lalezar';text-align:center;margin-bottom:4px;}
  #invoice .inv-line{display:flex;justify-content:space-between;border-bottom:1px dashed #999;padding:4px 0;}
  #invoice .inv-total{font-weight:900;font-size:1.1rem;border-top:2px solid #000;margin-top:6px;padding-top:6px;}
}

footer{
  text-align:center;padding:24px 10px 40px;color:var(--night-light);font-size:.85rem;
}

@media (max-width:480px){
  .cashier-btn span.label{display:none;}
}

/* ===== Welcome / table select screen ===== */
#welcomeScreen{
  position:fixed;inset:0;z-index:55;
  background:linear-gradient(160deg,var(--night) 0%,#4a2f1c 60%,var(--terracotta-dark) 130%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;color:var(--cream);
  transition:opacity .4s ease, visibility .4s ease;
}
#welcomeScreen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
#welcomeScreen h1{font-family:'Lalezar';font-size:clamp(2.4rem,9vw,3.6rem);color:var(--gold);margin-bottom:6px;}
#welcomeScreen p.sub{color:var(--sand-light);margin-bottom:22px;font-size:1rem;}
.table-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  max-width:380px;width:100%;margin-bottom:18px;
}
@media (min-width:480px){
  .table-grid{grid-template-columns:repeat(5,1fr);max-width:420px;}
}
.table-btn{
  aspect-ratio:1;border-radius:14px;border:2px solid var(--gold);background:rgba(255,255,255,.06);
  color:var(--gold);font-weight:800;font-size:1.1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s ease;
}
.table-btn:hover{background:var(--gold);color:var(--night);transform:translateY(-2px) scale(1.05);}
.skip-cashier-link{color:var(--sand-light);opacity:.75;font-size:.85rem;text-decoration:underline;background:none;border:none;cursor:pointer;margin-top:6px;}
.table-badge{
  position:fixed;top:16px;right:16px;z-index:56;
  background:var(--night);color:var(--gold);border:2px solid var(--gold);
  border-radius:16px;padding:10px 14px;font-weight:800;font-size:.9rem;
  cursor:pointer;box-shadow:var(--shadow);
}

/* ===== Items management (cashier) ===== */
.item-row{
  display:flex;gap:10px;align-items:center;background:var(--sand-light);
  border-radius:12px;padding:8px 10px;margin-bottom:8px;
}
.item-row .thumb{
  width:46px;height:46px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:var(--sand-dark);
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;overflow:hidden;
}
.item-row .thumb img{width:100%;height:100%;object-fit:cover;}
.item-row .info{flex:1;min-width:0;}
.item-row .info h4{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-row .info small{color:var(--night-light);}
.item-row .item-actions{display:flex;gap:4px;flex:0 0 auto;}
.icon-btn{
  width:30px;height:30px;border-radius:8px;border:none;background:var(--night);color:var(--gold);
  cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;
}
.icon-btn.danger{background:var(--red);color:#fff;}
.hidden-file{display:none;}
.add-item-form{
  background:var(--sand-light);border-radius:12px;padding:12px;margin-bottom:14px;
}
.add-item-form select{width:100%;padding:9px 10px;border-radius:10px;border:2px solid var(--sand-dark);margin-bottom:10px;font-family:inherit;background:#fff;}
</style>
</head>
<body>

<div class="dune-bg"></div>

<!-- Welcome / table selection screen -->
<div id="welcomeScreen">
  <h1 class="logo-font">كافي صيف</h1>
  <p class="sub">أهلاً بيك 🌙 اختر رقم طاولتك للمتابعة</p>
  <div class="table-grid" id="tableGrid"></div>
  <button class="skip-cashier-link" id="skipWelcome">متابعة بدون اختيار طاولة</button>
</div>

<button class="table-badge" id="tableBadge" style="display:none;" title="تغيير الطاولة"></button>

<button class="cashier-btn" id="cashierBtn" title="دخول الكاشير">
  <span class="dot"></span>
  🧾 <span class="label">الكاشير</span>
</button>

<header class="hero">
  <svg class="hero-scene" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3a2a55"/>
        <stop offset="45%" stop-color="#a8542f"/>
        <stop offset="100%" stop-color="#e3a24a"/>
      </linearGradient>
      <linearGradient id="duneFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8a5a34"/>
        <stop offset="100%" stop-color="#6e4527"/>
      </linearGradient>
      <linearGradient id="duneNear" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4a2f1c"/>
        <stop offset="100%" stop-color="#3a2416"/>
      </linearGradient>
    </defs>
    <rect width="800" height="400" fill="url(#sky)"/>
    <circle class="star" cx="120" cy="60" r="2" fill="#fff"/>
    <circle class="star" cx="260" cy="40" r="1.6" fill="#fff" style="animation-delay:.6s"/>
    <circle class="star" cx="640" cy="55" r="2" fill="#fff" style="animation-delay:1.1s"/>
    <circle class="star" cx="710" cy="90" r="1.4" fill="#fff" style="animation-delay:1.6s"/>
    <circle class="sun" cx="400" cy="150" r="60" fill="#f4c76a"/>
    <path d="M0,260 Q150,200 300,250 T600,235 T800,255 L800,400 L0,400 Z" fill="url(#duneFar)"/>
    <path d="M0,310 Q200,260 400,305 T800,300 L800,400 L0,400 Z" fill="url(#duneNear)"/>
    <path d="M120,270 q-4,-40 -22,-55 q14,4 20,18 q2,-30 -14,-48 q18,8 20,30 q6,-18 22,-24 q-10,16 -6,34 q12,-10 26,-8 q-16,10 -18,26 q10,-4 18,2 q-14,4 -18,16 z" fill="#2b1d14"/>
    <g class="lantern" style="animation-delay:.3s"><line x1="560" y1="30" x2="560" y2="55" stroke="#2b1d14" stroke-width="2"/><circle cx="560" cy="65" r="10" fill="#d4a853"/></g>
    <g class="lantern" style="animation-delay:1s"><line x1="620" y1="20" x2="620" y2="48" stroke="#2b1d14" stroke-width="2"/><circle cx="620" cy="58" r="9" fill="#e6b95f"/></g>
    <g class="lantern" style="animation-delay:1.6s"><line x1="670" y1="35" x2="670" y2="60" stroke="#2b1d14" stroke-width="2"/><circle cx="670" cy="70" r="10" fill="#d4a853"/></g>
  </svg>
  <div class="text-scrim"></div>
  <div class="hero-content">
    <h1 class="logo-font">كافي صيف</h1>
    <div class="divider"></div>
    <p class="tag">نكهة الصحراء الدافئة... مشاوي وحلويات أصيلة</p>
  </div>
</header>

<div class="tabs-wrap">
  <div class="tabs" id="tabs"></div>
</div>

<main>
  <h2 class="section-title" id="sectionTitle">المشاوي</h2>
  <div class="grid" id="grid"></div>
</main>

<button class="cart-fab" id="cartFab">
  🛒 السلة <span class="badge" id="cartBadge">0</span>
</button>

<footer>كافي صيف — تجربة أصيلة بروح صحراوية دافئة 🏜️</footer>

<!-- Overlay -->
<div class="overlay" id="overlay"></div>

<!-- Cart Panel -->
<div class="panel left" id="cartPanel">
  <div class="panel-head">
    <span>🛒 سلتك</span>
    <button id="closeCart">✕</button>
  </div>
  <div class="panel-body" id="cartBody"></div>
  <div class="panel-foot">
    <div class="total-row"><span>المجموع</span><span id="cartTotal">0 د.ع</span></div>
    <input class="field" id="tableNum" type="number" min="1" max="20" placeholder="رقم الطاولة (١-٢٠)">
    <input class="field" id="orderNote" placeholder="ملاحظات (اختياري)...">
    <button class="btn-main" id="sendOrderBtn">📤 إرسال الطلب</button>
  </div>
</div>

<!-- Cashier Panel -->
<div class="panel right" id="cashierPanel">
  <div class="panel-head">
    <span>🧾 لوحة الكاشير</span>
    <button id="closeCashier">✕</button>
  </div>
  <div class="panel-body">
    <div class="cashier-tabs">
      <button class="active" data-ctab="orders">الطلبات</button>
      <button data-ctab="items">الأصناف</button>
      <button data-ctab="reports">التقارير</button>
    </div>
    <div id="ordersView"></div>
    <div id="itemsView" style="display:none;"></div>
    <div id="reportsView" style="display:none;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div id="invoice"></div>

<script>
/* ================= DATA ================= */
const CATS = [
  {id:'grills', name:'المشاوي', icon:'🔥'},
  {id:'appet', name:'المقبلات', icon:'🥗'},
  {id:'rice', name:'الرز والمقالي', icon:'🍚'},
  {id:'drinks', name:'المشروبات', icon:'🥤'},
  {id:'sweets', name:'الحلويات', icon:'🍰'},
];

const DEFAULT_ITEMS = [
  {id:1, cat:'grills', name:'كباب موصلي', desc:'لحم غنم مفروم بالبهارات الموصلية', price:15000, img:'', emoji:'🍢'},
  {id:2, cat:'grills', name:'تكة دجاج', desc:'صدور دجاج متبلة ومشوية على الفحم', price:12000, img:'', emoji:'🍗'},
  {id:3, cat:'grills', name:'كباب حلبي', desc:'كباب حار بصلصة البندورة والفلفل', price:14000, img:'', emoji:'🌶️'},
  {id:4, cat:'grills', name:'ريش غنم مشوية', desc:'ريش طرية متبلة بأعشاب صحراوية', price:19000, img:'', emoji:'🍖'},
  {id:5, cat:'appet', name:'سلطة موصلية', desc:'خضار طازج، رمان، ليمون وزيت زيتون', price:6000, img:'', emoji:'🥗'},
  {id:6, cat:'appet', name:'حمص باللحمة', desc:'حمص كريمي مغطى بلحم مفروم محمر', price:8000, img:'', emoji:'🧆'},
  {id:7, cat:'appet', name:'دولمة', desc:'ورق عنب وخضار محشية بالرز واللحم', price:10000, img:'', emoji:'🫑'},
  {id:8, cat:'rice', name:'تمن عنبر بالدجاج', desc:'رز بسمتي معطر مع دجاج مطبوخ', price:13000, img:'', emoji:'🍛'},
  {id:9, cat:'rice', name:'برياني لحم', desc:'رز برياني حار مع قطع لحم طرية', price:16000, img:'', emoji:'🍚'},
  {id:10, cat:'drinks', name:'عصير ليمون بالنعناع', desc:'منعش وطازج مع أوراق نعناع', price:4000, img:'', emoji:'🍋'},
  {id:11, cat:'drinks', name:'شاي عراقي', desc:'شاي أصيل بالهيل والسكر', price:2000, img:'', emoji:'🍵'},
  {id:12, cat:'drinks', name:'آيران بارد', desc:'لبن مخفوق بارد منعش', price:3000, img:'', emoji:'🥛'},
  {id:13, cat:'sweets', name:'كنافة بالفستق', desc:'كنافة ساخنة بالجبن والقطر والفستق', price:9000, img:'', emoji:'🍮'},
  {id:14, cat:'sweets', name:'بقلاوة مشكلة', desc:'طبقات عجين هشة بالمكسرات والعسل', price:8000, img:'', emoji:'🍯'},
  {id:15, cat:'sweets', name:'زلابية', desc:'عجين مقلي مقرمش مغطى بالقطر', price:5000, img:'', emoji:'🍩'},
];

/* ================= STATE ================= */
let activeCat = 'grills';
let cart = []; // {itemId, qty}
const ORDERS_KEY = 'cafe_sayf_orders';
const CUSTOM_ITEMS_KEY = 'cafe_sayf_custom_items';
const ITEM_IMAGES_KEY = 'cafe_sayf_item_images';
const TABLE_KEY = 'cafe_sayf_selected_table';
function loadOrders(){ try{return JSON.parse(localStorage.getItem(ORDERS_KEY))||[]}catch(e){return []} }
function saveOrders(o){ localStorage.setItem(ORDERS_KEY, JSON.stringify(o)); }
function loadCustomItems(){ try{return JSON.parse(localStorage.getItem(CUSTOM_ITEMS_KEY))||[]}catch(e){return []} }
function saveCustomItems(arr){ localStorage.setItem(CUSTOM_ITEMS_KEY, JSON.stringify(arr)); }
function loadItemImages(){ try{return JSON.parse(localStorage.getItem(ITEM_IMAGES_KEY))||{}}catch(e){return {}} }
function saveItemImages(obj){ localStorage.setItem(ITEM_IMAGES_KEY, JSON.stringify(obj)); }

let ITEMS = [];
function rebuildItems(){
  const custom = loadCustomItems();
  const images = loadItemImages();
  ITEMS = DEFAULT_ITEMS.concat(custom).map(it => ({...it, img: images[it.id] || it.img || ''}));
}
rebuildItems();

/* ===== Table selection ===== */
let selectedTable = localStorage.getItem(TABLE_KEY) || '';
function setSelectedTable(n){
  selectedTable = String(n);
  localStorage.setItem(TABLE_KEY, selectedTable);
  updateTableUI();
}
function updateTableUI(){
  const badge = document.getElementById('tableBadge');
  const tableNumField = document.getElementById('tableNum');
  if(selectedTable){
    badge.style.display = 'block';
    badge.textContent = '🪑 طاولة ' + selectedTable;
    if(tableNumField) tableNumField.value = selectedTable;
  } else {
    badge.style.display = 'none';
  }
}
function openWelcome(){ document.getElementById('welcomeScreen').classList.remove('hidden'); }
function closeWelcome(){ document.getElementById('welcomeScreen').classList.add('hidden'); }
(function initWelcome(){
  const grid = document.getElementById('tableGrid');
  for(let i=1;i<=20;i++){
    const b = document.createElement('button');
    b.className='table-btn'; b.textContent=i;
    b.onclick = ()=>{ setSelectedTable(i); closeWelcome(); toast('طاولة رقم '+i+' ✓'); };
    grid.appendChild(b);
  }
  document.getElementById('skipWelcome').onclick = closeWelcome;
  document.getElementById('tableBadge').onclick = openWelcome;
  if(selectedTable){ closeWelcome(); } else { openWelcome(); }
  updateTableUI();
})();

/* ================= RENDER TABS ================= */
const tabsEl = document.getElementById('tabs');
CATS.forEach(c=>{
  const b = document.createElement('button');
  b.className = 'tab' + (c.id===activeCat?' active':'');
  b.dataset.cat = c.id;
  b.innerHTML = `${c.icon} ${c.name}`;
  b.onclick = ()=>{ activeCat=c.id; renderTabs(); renderGrid(); };
  tabsEl.appendChild(b);
});
function renderTabs(){
  [...tabsEl.children].forEach(b=> b.classList.toggle('active', b.dataset.cat===activeCat));
}

/* ================= RENDER GRID ================= */
const gridEl = document.getElementById('grid');
const titleEl = document.getElementById('sectionTitle');
function fmt(n){ return n.toLocaleString('en-US') + ' د.ع'; }

function renderGrid(){
  titleEl.textContent = CATS.find(c=>c.id===activeCat).name;
  gridEl.innerHTML = '';
  const items = ITEMS.filter(i=>i.cat===activeCat);
  items.forEach((item,idx)=>{
    const qty = cart.find(c=>c.itemId===item.id)?.qty || 1;
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (idx*0.06)+'s';
    card.innerHTML = `
      <div class="img-wrap">
        ${item.img ? `<img src="${item.img}" alt="${item.name}" onerror="this.parentElement.innerHTML='<div class=&quot;emoji-fallback&quot;>${item.emoji}</div>'">` : `<div class="emoji-fallback">${item.emoji}</div>`}
      </div>
      <div class="body">
        <h3>${item.name}</h3>
        <p class="desc">${item.desc}</p>
        <div class="row">
          <span class="price">${fmt(item.price)}</span>
          <div class="qty-box">
            <button data-act="minus">−</button>
            <span data-qty>${qty}</span>
            <button data-act="plus">+</button>
          </div>
        </div>
        <button class="add-btn" data-act="add">أضف للسلة</button>
      </div>`;
    let localQty = qty;
    const qtySpan = card.querySelector('[data-qty]');
    card.querySelector('[data-act="minus"]').onclick = ()=>{ if(localQty>1){localQty--; qtySpan.textContent=localQty;} };
    card.querySelector('[data-act="plus"]').onclick = ()=>{ localQty++; qtySpan.textContent=localQty; };
    const addBtn = card.querySelector('[data-act="add"]');
    addBtn.onclick = ()=>{
      addToCart(item.id, localQty);
      addBtn.classList.remove('flash'); void addBtn.offsetWidth; addBtn.classList.add('flash');
      addBtn.textContent = 'أُضيف ✓';
      setTimeout(()=> addBtn.textContent='أضف للسلة', 900);
      bumpCartFab();
    };
    gridEl.appendChild(card);
  });
}

/* ================= CART ================= */
function addToCart(itemId, qty){
  const existing = cart.find(c=>c.itemId===itemId);
  if(existing) existing.qty += qty;
  else cart.push({itemId, qty});
  renderCartBadge();
}
function renderCartBadge(){
  const total = cart.reduce((s,c)=>s+c.qty,0);
  document.getElementById('cartBadge').textContent = total;
}
function bumpCartFab(){
  const fab = document.getElementById('cartFab');
  fab.classList.remove('bump'); void fab.offsetWidth; fab.classList.add('bump');
}
function cartTotalPrice(){
  return cart.reduce((s,c)=>{ const it=ITEMS.find(i=>i.id===c.itemId); return s + it.price*c.qty; },0);
}
function renderCartPanel(){
  const body = document.getElementById('cartBody');
  if(cart.length===0){
    body.innerHTML = '<div class="empty-msg">🛒<br>سلتك فارغة، اختر من المنيو</div>';
  } else {
    body.innerHTML = '';
    cart.forEach(c=>{
      const it = ITEMS.find(i=>i.id===c.itemId);
      const row = document.createElement('div');
      row.className='cart-item';
      row.innerHTML = `
        ${it.img ? `<img src="${it.img}" onerror="this.outerHTML='<div class=&quot;emoji-fallback&quot;>${it.emoji}</div>'">` : `<div class="emoji-fallback">${it.emoji}</div>`}
        <div class="info"><h4>${it.name}</h4><small>${c.qty} × ${fmt(it.price)}</small></div>
        <button class="del" data-id="${c.itemId}">🗑️</button>`;
      row.querySelector('.del').onclick = ()=>{ cart = cart.filter(x=>x.itemId!==c.itemId); renderCartPanel(); renderCartBadge(); };
      body.appendChild(row);
    });
  }
  document.getElementById('cartTotal').textContent = fmt(cartTotalPrice());
  if(selectedTable) document.getElementById('tableNum').value = selectedTable;
}

/* ================= PANELS ================= */
const overlay = document.getElementById('overlay');
const cartPanel = document.getElementById('cartPanel');
const cashierPanel = document.getElementById('cashierPanel');
function openPanel(p){ overlay.classList.add('show'); p.classList.add('show'); }
function closeAll(){ overlay.classList.remove('show'); cartPanel.classList.remove('show'); cashierPanel.classList.remove('show'); }
overlay.onclick = closeAll;
document.getElementById('cartFab').onclick = ()=>{ renderCartPanel(); openPanel(cartPanel); };
document.getElementById('closeCart').onclick = closeAll;
document.getElementById('cashierBtn').onclick = ()=>{ renderOrdersView(); openPanel(cashierPanel); };
document.getElementById('closeCashier').onclick = closeAll;

/* ================= TOAST ================= */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ================= SEND ORDER ================= */
document.getElementById('sendOrderBtn').onclick = ()=>{
  if(cart.length===0){ toast('السلة فارغة!'); return; }
  const table = document.getElementById('tableNum').value || '—';
  if(document.getElementById('tableNum').value) setSelectedTable(document.getElementById('tableNum').value);
  const note = document.getElementById('orderNote').value;
  const orders = loadOrders();
  const order = {
    id: 'ORD-' + String(orders.length+1).padStart(3,'0'),
    table, note,
    items: cart.map(c=>({...ITEMS.find(i=>i.id===c.itemId), qty:c.qty})),
    total: cartTotalPrice(),
    status: 'new',
    time: new Date().toISOString(),
  };
  orders.push(order);
  saveOrders(orders);
  cart = [];
  renderCartBadge();
  document.getElementById('orderNote').value='';
  closeAll();
  toast('تم إرسال طلبك بنجاح! رقم الطلب '+order.id);
};

/* ================= CASHIER: ORDERS ================= */
function timeAgo(iso){
  const mins = Math.max(0, Math.round((Date.now()-new Date(iso))/60000));
  if(mins<1) return 'الآن';
  if(mins<60) return 'منذ '+mins+' د';
  return 'منذ '+Math.round(mins/60)+' س';
}
function renderOrdersView(){
  const view = document.getElementById('ordersView');
  const orders = loadOrders().slice().reverse();
  const active = orders.filter(o=>o.status!=='done');
  if(active.length===0){ view.innerHTML='<div class="empty-msg">لا توجد طلبات حالياً 🧾</div>'; return; }
  view.innerHTML='';
  active.forEach(o=>{
    const card = document.createElement('div');
    card.className = 'order-card status-'+o.status;
    card.innerHTML = `
      <div class="top"><span>#${o.id} • طاولة ${o.table}</span><span>${timeAgo(o.time)}</span></div>
      ${o.items.map(it=>`<div class="line"><span>${it.name} ×${it.qty}</span><span>${fmt(it.price*it.qty)}</span></div>`).join('')}
      ${o.note?`<div class="line">📝 ${o.note}</div>`:''}
      <div class="line" style="font-weight:800;color:var(--night)"><span>المجموع</span><span>${fmt(o.total)}</span></div>
      <div class="actions">
        ${o.status==='new'?'<button class="btn-accept" data-a="ready">قيد التحضير</button>':''}
        ${o.status==='ready'?'<button class="btn-pay" data-a="pay">💵 تم الدفع</button>':''}
        <button class="btn-print" data-a="print">🖨️ فاتورة</button>
      </div>`;
    card.querySelector('[data-a="ready"]')?.addEventListener('click', ()=>updateOrder(o.id,{status:'ready'}));
    card.querySelector('[data-a="pay"]')?.addEventListener('click', ()=>updateOrder(o.id,{status:'done', paidAt:new Date().toISOString()}));
    card.querySelector('[data-a="print"]').addEventListener('click', ()=>printInvoice(o));
    view.appendChild(card);
  });
}
function updateOrder(id, patch){
  const orders = loadOrders();
  const o = orders.find(x=>x.id===id);
  Object.assign(o, patch);
  saveOrders(orders);
  renderOrdersView();
  toast('تم تحديث الطلب #'+id);
}

/* ================= PRINT INVOICE ================= */
function printInvoice(o){
  const inv = document.getElementById('invoice');
  inv.innerHTML = `
    <h2>كافي صيف</h2>
    <p style="text-align:center;margin-bottom:10px;">فاتورة طلب #${o.id} — طاولة ${o.table}</p>
    <p style="text-align:center;margin-bottom:10px;">${new Date(o.time).toLocaleString('ar-IQ')}</p>
    ${o.items.map(it=>`<div class="inv-line"><span>${it.name} ×${it.qty}</span><span>${fmt(it.price*it.qty)}</span></div>`).join('')}
    <div class="inv-line inv-total"><span>الإجمالي</span><span>${fmt(o.total)}</span></div>
    <p style="text-align:center;margin-top:14px;">شكراً لزيارتكم 🌙</p>`;
  window.print();
}

/* ================= CASHIER: ITEMS MANAGEMENT ================= */
function resizeImageFile(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function setItemImage(id, dataUrl){
  const images = loadItemImages();
  images[id] = dataUrl;
  saveItemImages(images);
  rebuildItems();
  renderGrid();
  renderItemsView();
  toast('تم تحديث صورة الصنف 📷');
}
function deleteCustomItem(id){
  if(!confirm('حذف هذا الصنف؟')) return;
  saveCustomItems(loadCustomItems().filter(i=>i.id!==id));
  const images = loadItemImages(); delete images[id]; saveItemImages(images);
  rebuildItems();
  renderGrid();
  renderItemsView();
  toast('تم حذف الصنف');
}
function renderItemsView(){
  const view = document.getElementById('itemsView');
  view.innerHTML = `
    <button class="btn-main" id="toggleAddForm" style="margin-bottom:12px;">+ إضافة صنف جديد</button>
    <div class="add-item-form" id="addItemForm" style="display:none;">
      <input class="field" id="newName" placeholder="اسم الصنف">
      <select id="newCat">${CATS.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('')}</select>
      <input class="field" id="newPrice" type="number" min="0" placeholder="السعر (د.ع)">
      <input class="field" id="newDesc" placeholder="وصف قصير (اختياري)">
      <input class="field" id="newEmoji" placeholder="إيموجي احتياطي (اختياري) مثل 🍽️">
      <label style="display:block;margin-bottom:10px;font-size:.85rem;">📷 صورة الصنف (اختياري)
        <input class="field" id="newImageFile" type="file" accept="image/*" capture="environment">
      </label>
      <button class="btn-main" id="saveNewItem">حفظ الصنف</button>
    </div>
    <div id="itemsList"></div>`;
  document.getElementById('toggleAddForm').onclick = ()=>{
    const f = document.getElementById('addItemForm');
    f.style.display = f.style.display==='none' ? 'block' : 'none';
  };
  document.getElementById('saveNewItem').onclick = ()=>{
    const name = document.getElementById('newName').value.trim();
    const price = parseInt(document.getElementById('newPrice').value, 10);
    const cat = document.getElementById('newCat').value;
    const desc = document.getElementById('newDesc').value.trim();
    const emoji = document.getElementById('newEmoji').value.trim() || '🍽️';
    if(!name || !price){ toast('لازم تكتب الاسم والسعر'); return; }
    const id = 9000 + Date.now()%100000;
    const custom = loadCustomItems();
    custom.push({id, cat, name, desc: desc||'صنف جديد', price, img:'', emoji});
    saveCustomItems(custom);
    const file = document.getElementById('newImageFile').files[0];
    rebuildItems(); renderGrid();
    if(file){
      resizeImageFile(file, 700, dataUrl => setItemImage(id, dataUrl));
    } else {
      renderItemsView();
      toast('تمت إضافة الصنف ✓');
    }
  };
  const list = document.getElementById('itemsList');
  list.innerHTML = '';
  ITEMS.forEach(it=>{
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <div class="thumb">${it.img?`<img src="${it.img}">`:it.emoji}</div>
      <div class="info"><h4>${it.name}</h4><small>${fmt(it.price)} • ${CATS.find(c=>c.id===it.cat)?.name||''}</small></div>
      <div class="item-actions">
        <label class="icon-btn" title="تغيير الصورة">📷<input type="file" accept="image/*" capture="environment" class="hidden-file"></label>
        ${it.id>=9000?'<button class="icon-btn danger" title="حذف">🗑️</button>':''}
      </div>`;
    row.querySelector('input[type=file]').onchange = (e)=>{
      const file = e.target.files[0];
      if(file) resizeImageFile(file, 700, dataUrl => setItemImage(it.id, dataUrl));
    };
    row.querySelector('.icon-btn.danger')?.addEventListener('click', ()=>deleteCustomItem(it.id));
    list.appendChild(row);
  });
}

/* ================= CASHIER: REPORTS ================= */
document.querySelectorAll('[data-ctab]').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('[data-ctab]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const tab = b.dataset.ctab;
    document.getElementById('ordersView').style.display = tab==='orders'?'block':'none';
    document.getElementById('itemsView').style.display = tab==='items'?'block':'none';
    document.getElementById('reportsView').style.display = tab==='reports'?'block':'none';
    if(tab==='items') renderItemsView();
    if(tab==='reports') renderReports();
  };
});
function renderReports(){
  const orders = loadOrders();
  const done = orders.filter(o=>o.status==='done');
  const revenue = done.reduce((s,o)=>s+o.total,0);
  const count = done.length;
  const itemCounts = {};
  done.forEach(o=>o.items.forEach(it=>{ itemCounts[it.name]=(itemCounts[it.name]||0)+it.qty; }));
  const top = Object.entries(itemCounts).sort((a,b)=>b[1]-a[1])[0];
  const view = document.getElementById('reportsView');
  view.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><b>${count}</b><span>عدد الطلبات المكتملة</span></div>
      <div class="stat"><b>${fmt(revenue)}</b><span>إجمالي المبيعات</span></div>
      <div class="stat"><b>${top? top[0]:'—'}</b><span>الأكثر طلباً${top?(' ('+top[1]+' مرة)'):''}</span></div>
      <div class="stat"><b>${count? fmt(Math.round(revenue/count)):'0'}</b><span>متوسط الفاتورة</span></div>
    </div>
    ${done.length===0?'<div class="empty-msg">لا توجد مبيعات مكتملة بعد</div>':
      done.slice().reverse().map(o=>`
      <div class="order-card status-done">
        <div class="top"><span>#${o.id} • طاولة ${o.table}</span><span>${fmt(o.total)}</span></div>
        <div class="line"><span>${new Date(o.time).toLocaleString('ar-IQ')}</span><span>${o.items.reduce((s,i)=>s+i.qty,0)} صنف</span></div>
      </div>`).join('')}
    <button class="btn-ghost" id="clearData">🗑️ تصفير بيانات المبيعات</button>`;
  document.getElementById('clearData').onclick = ()=>{
    if(confirm('هل أنت متأكد من حذف كل بيانات الطلبات؟')){ saveOrders([]); renderReports(); renderOrdersView(); toast('تم التصفير'); }
  };
}

/* ================= INIT ================= */
renderTabs();
renderGrid();
renderCartBadge();
</script>
</body>
</html>
